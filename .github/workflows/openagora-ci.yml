name: openagora-ci
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e code/core -e code/experiments
      - run: ruff check src tests
        working-directory: code/core
      - run: mypy src
        working-directory: code/core
      - run: python -m pytest --cov=src/openagora --cov-fail-under=85
        working-directory: code/core
      - run: python -m pytest tests --cov=openagora_experiments --cov-fail-under=80
        working-directory: code/experiments
      - run: python examples/egor_smoke.py
      - run: python reproduce/verify.py
      - run: openagora doctor --config code/core/configs/default.yaml
