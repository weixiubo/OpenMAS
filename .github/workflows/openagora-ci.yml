name: openagora-ci
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.11'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check code scripts examples
      - run: uv run --no-sync ruff format --check code scripts examples
      - run: uv run --no-sync mypy --config-file pyproject.toml
      - run: uv run --no-sync python scripts/check_structure.py
      - run: uv run --no-sync pytest --cov=openagora --cov-fail-under=85
      - run: uv run --no-sync pytest --cov=openagora_experiments --cov-fail-under=80
      - run: uv run --no-sync python scripts/check_historical.py
      - run: uv run --no-sync openagora doctor
      - run: uv run --no-sync openagora demo
      - run: uv run --no-sync openagora reproduce
      - run: uv build --all-packages
      - run: uv run --no-sync python scripts/check_release.py
      - run: uv run --no-sync python scripts/check_sdist.py
