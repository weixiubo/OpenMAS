[project]
name = "openagora-experiments"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "OpenAGORA experiment drivers"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.1,<7",
  "openagora"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "pillow>=10,<13"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["openagora_experiments*"]

[tool.pytest.ini_options]
addopts = "-q"
[tool.setuptools.package-data]
"openagora_experiments" = ["evidence/egor-v10/*", "py.typed"]
