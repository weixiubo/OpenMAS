provider:
  name: mock
  model: mock-leader-v1
  provider_mode: mock
  temperature: 0.0
  seed: 42
  timeout_s: 30
  max_retries: 2
  retry_backoff_base: 0.5
  max_concurrency: 4
  enable_idempotency_key: true

paths:
  db_path: .openagora/openagora.db
  artifacts_dir: .openagora/artifacts

thresholds:
  max_negotiation_rounds: 5
  max_reconfig_rounds: 3
  max_reconfigs: 2
  cooldown_steps: 3
  cache_hit_threshold: 0.8
  cache_write_perf_threshold: 0.7
  cache_write_align_threshold: 0.5
  cache_invalidate_threshold: 0.5
  feedback_stable_threshold: 0.9
  type_weight: 0.6

toggles:
  enable_negotiation: true
  enable_runtime_reconfig: true
  enable_cache: true

runtime:
  max_steps: 4
  worker_count: 4
  data_version: qa-mini-v1

templates:
  registry_path: null
  template_id: default
  version: v1
  persona_strategy: fixed
  fixed_personas:
    - planner
    - analyst
    - critic
    - integrator
  persona_pool:
    - planner
    - analyst
    - critic
    - integrator
    - researcher
    - verifier

plugins:
  task_adapter: qa_tools
  tool_adapter: local_tools
  discovery_modules: []

audit:
  event_schema_version: v2
  max_prompt_chars: 240

task:
  task_id: demo-qa-001
  prompt: "Use tools to answer: what is 2 + 3?"
  metadata:
    reference_answer: "5"
    primary_type: multi_step_qa
    uncertainty: medium
    complexity: medium
    interdependence: reciprocal

eval:
  dataset_path: ../../experiments/data/qa_mini.jsonl
  output_csv: ../../experiments/results/eval_rows.csv
  output_summary_csv: ../../experiments/results/eval_summary.csv
  output_failure_csv: ../../experiments/results/eval_failure_cases.csv
  output_pairwise_csv: ../../experiments/results/eval_pairwise_stats.csv
  output_judge_audit_jsonl: ../../experiments/results/eval_judge_audit.jsonl
  output_manifest_json: ../../experiments/results/eval_manifest.json
  output_hashes_json: ../../experiments/results/eval_hashes.json
  gaia_manifest_path: ../../experiments/data/gaia40_manifest.json
  sample_limit: 40
  judge_mode: rule
  judge_model: gpt-4o-mini
  borderline_low: 0.4
  borderline_high: 0.8
  stats_bootstrap_n: 10000
  stats_seed: 2026
